<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="noise-overlay"></div>

<div class="app">
  <header class="header">
    <div class="header-brand">
      <span class="logo-dot"></span>
      <h1>TTS Studio</h1>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="generate">
        <span class="tab-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>
        </span>
        合成
      </button>
      <button class="tab" data-tab="clone">
        <span class="tab-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
        </span>
        音色克隆
      </button>
      <button class="tab" data-tab="design">
        <span class="tab-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </span>
        音色设计
      </button>
      <button class="tab" data-tab="history">
        <span class="tab-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
        </span>
        历史
      </button>
    </nav>
  </header>

  <!-- ========== GENERATE TAB ========== -->
  <main class="panel active" id="panel-generate">
    <div class="generate-layout">

      <!-- Left: Input -->
      <section class="input-section">
        <!-- Settings (collapsible) -->
        <details class="settings-card" id="settingsCard">
          <summary class="settings-summary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <span>API 设置</span>
            <span class="settings-status" id="settingsStatus">未配置</span>
          </summary>
          <div class="settings-body">
            <label class="field">
              <span>API URL</span>
              <input type="url" id="apiUrl" placeholder="https://api.openai.com/v1" autocomplete="off">
            </label>
            <label class="field">
              <span>API Key</span>
              <div class="password-wrap">
                <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
                <button type="button" class="toggle-pw" id="togglePw" title="显示/隐藏">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </label>
            <button class="btn btn-secondary" id="saveConfig">保存设置</button>
            <span class="config-msg" id="configMsg"></span>
          </div>
        </details>

        <!-- Text input -->
        <div class="text-area-wrap">
          <div class="text-area-toolbar">
            <span class="char-count" id="charCount">0 字</span>
            <label class="btn btn-ghost btn-sm upload-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              上传文件
              <input type="file" id="fileUpload" accept=".txt,.md" hidden>
            </label>
          </div>
          <textarea id="textInput" placeholder="输入或粘贴要合成的文本..." rows="10"></textarea>
        </div>
      </section>

      <!-- Right: Controls -->
      <section class="control-section">
        <!-- Model -->
        <div class="control-group">
          <label class="control-label">模型</label>
          <div class="select-wrap">
            <input type="text" id="voiceInput" placeholder="mimo-v2.5-tts" autocomplete="off">
          </div>
        </div>

        <!-- Voice selector -->
        <div class="control-group">
          <label class="control-label">音色</label>
          <div class="select-wrap">
            <select id="voiceSelect">
              <option value="">默认音色</option>
            </select>
          </div>
        </div>

        <!-- Speed -->
        <div class="control-group">
          <label class="control-label">
            <span>语速</span>
            <span class="param-value" id="speedVal">1.0x</span>
          </label>
          <div class="slider-wrap">
            <span class="slider-bound">0.25</span>
            <input type="range" id="speedSlider" min="0.25" max="4" step="0.05" value="1">
            <span class="slider-bound">4.0</span>
          </div>
        </div>

        <!-- Pitch -->
        <div class="control-group">
          <label class="control-label">
            <span>音调</span>
            <span class="param-value" id="pitchVal">0</span>
          </label>
          <div class="slider-wrap">
            <span class="slider-bound">-20</span>
            <input type="range" id="pitchSlider" min="-20" max="20" step="1" value="0">
            <span class="slider-bound">+20</span>
          </div>
        </div>

        <!-- Generate -->
        <button class="btn btn-primary btn-generate" id="generateBtn">
          <span class="btn-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>
          </span>
          生成语音
        </button>

        <!-- Status -->
        <div class="status-bar" id="statusBar" hidden>
          <span class="status-text" id="statusText"></span>
          <div class="status-spinner" id="statusSpinner" hidden></div>
        </div>

        <!-- Audio player -->
        <div class="player-card" id="playerCard" hidden>
          <div class="player-visualizer" id="visualizer">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <audio id="audioPlayer" controls></audio>
          <a class="btn btn-ghost btn-sm download-link" id="downloadLink" download>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载 MP3
          </a>
        </div>
      </section>
    </div>
  </main>

  <!-- ========== CLONE TAB ========== -->
  <main class="panel" id="panel-clone">
    <div class="generate-layout">
      <section class="input-section">
        <div class="text-area-wrap">
          <div class="text-area-toolbar">
            <span>模型名称</span>
          </div>
          <input type="text" id="cloneModel" class="clone-model-input" placeholder="mimo-v2.5-tts-voiceclone" autocomplete="off">
        </div>
        <div class="text-area-wrap" style="margin-top:16px;">
          <div class="text-area-toolbar">
            <span>音色名称（可选）</span>
          </div>
          <input type="text" id="cloneName" class="clone-model-input" placeholder="为音色取个名字" autocomplete="off">
        </div>
        <div class="upload-zone" id="cloneUploadZone">
          <input type="file" id="cloneAudio" accept="audio/*" hidden>
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p id="cloneFileLabel">点击或拖拽上传参考音频</p>
          <span class="upload-hint">支持 wav, mp3, m4a, ogg, flac</span>
        </div>
        <div class="text-area-wrap" style="margin-top:16px;">
          <div class="text-area-toolbar">
            <span class="char-count" id="cloneCharCount">0 字</span>
          </div>
          <textarea id="cloneRefText" placeholder="输入要让克隆音色说的话..." rows="4"></textarea>
        </div>
      </section>
      <section class="control-section">
        <button class="btn btn-primary btn-generate" id="cloneBtn">
          <span class="btn-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
          </span>
          开始克隆
        </button>
        <div class="status-bar" id="cloneStatusBar" hidden>
          <span class="status-text" id="cloneStatusText"></span>
          <div class="status-spinner" id="cloneStatusSpinner" hidden></div>
        </div>
        <div class="player-card" id="clonePlayerCard" hidden>
          <audio id="cloneAudioPlayer" controls></audio>
          <a class="btn btn-ghost btn-sm download-link" id="cloneDownloadLink" download>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载
          </a>
        </div>
        <div class="clone-filter" id="cloneFilter" hidden>
          <button class="btn btn-ghost btn-sm filter-btn active" data-filter="all">全部</button>
          <button class="btn btn-ghost btn-sm filter-btn" data-filter="fav">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
            仅收藏
          </button>
        </div>
      </section>
    </div>
    <div class="voice-list" id="cloneVoiceList"></div>
    <div class="pagination" id="clonePagination" hidden></div>
    <div class="history-empty" id="cloneEmpty" hidden>
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p>暂无克隆音色</p>
    </div>
  </main>

  <!-- ========== DESIGN TAB ========== -->
  <main class="panel" id="panel-design">
    <div class="generate-layout">
      <section class="input-section">
        <div class="text-area-wrap">
          <div class="text-area-toolbar">
            <span>模型名称</span>
          </div>
          <input type="text" id="designModel" class="clone-model-input" placeholder="mimo-v2.5-tts-voicedesign" autocomplete="off">
        </div>
        <div class="text-area-wrap" style="margin-top:16px;">
          <div class="text-area-toolbar">
            <span>音色名称（可选）</span>
          </div>
          <input type="text" id="designName" class="clone-model-input" placeholder="为音色取个名字" autocomplete="off">
        </div>
        <div class="text-area-wrap" style="margin-top:16px;">
          <div class="text-area-toolbar">
            <span class="char-count" id="designCharCount">0 字</span>
          </div>
          <textarea id="designPrompt" placeholder="描述你想要的音色特征，例如：温柔的女声，音调偏高，语速适中..." rows="4"></textarea>
        </div>
      </section>
      <section class="control-section">
        <button class="btn btn-primary btn-generate" id="designBtn">
          <span class="btn-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </span>
          生成音色
        </button>
        <div class="status-bar" id="designStatusBar" hidden>
          <span class="status-text" id="designStatusText"></span>
          <div class="status-spinner" id="designStatusSpinner" hidden></div>
        </div>
        <div class="player-card" id="designPlayerCard" hidden>
          <audio id="designAudioPlayer" controls></audio>
          <a class="btn btn-ghost btn-sm download-link" id="designDownloadLink" download>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载
          </a>
        </div>
      </section>
    </div>
    <div class="voice-list" id="designVoiceList"></div>
    <div class="pagination" id="designPagination" hidden></div>
    <div class="history-empty" id="designEmpty" hidden>
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p>暂无设计音色</p>
    </div>
  </main>

  <!-- ========== HISTORY TAB ========== -->
  <main class="panel" id="panel-history">
    <div class="history-list" id="historyList"></div>
    <div class="pagination" id="pagination" hidden></div>
    <div class="history-empty" id="historyEmpty" hidden>
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p>暂无历史记录</p>
    </div>
  </main>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="/js/utils.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/tts.js"></script>
<script src="/js/history.js"></script>
<script src="/js/clone.js"></script>
<script src="/js/design.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
