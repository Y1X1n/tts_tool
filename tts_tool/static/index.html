<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="noise-overlay"></div>

<div class="app">
  <header class="header">
    <div class="header-brand">
      <span class="logo-dot"></span>
      <h1>TTS Studio</h1>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="generate">
        <span class="tab-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>
        </span>
        合成
      </button>
      <button class="tab" data-tab="history">
        <span class="tab-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
        </span>
        历史
      </button>
    </nav>
  </header>

  <!-- ========== GENERATE TAB ========== -->
  <main class="panel active" id="panel-generate">
    <div class="generate-layout">

      <!-- Left: Input -->
      <section class="input-section">
        <!-- Settings (collapsible) -->
        <details class="settings-card" id="settingsCard">
          <summary class="settings-summary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <span>API 设置</span>
            <span class="settings-status" id="settingsStatus">未配置</span>
          </summary>
          <div class="settings-body">
            <label class="field">
              <span>API URL</span>
              <input type="url" id="apiUrl" placeholder="https://api.openai.com/v1" autocomplete="off">
            </label>
            <label class="field">
              <span>API Key</span>
              <div class="password-wrap">
                <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
                <button type="button" class="toggle-pw" id="togglePw" title="显示/隐藏">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </label>
            <button class="btn btn-secondary" id="saveConfig">保存设置</button>
            <span class="config-msg" id="configMsg"></span>
          </div>
        </details>

        <!-- Text input -->
        <div class="text-area-wrap">
          <div class="text-area-toolbar">
            <span class="char-count" id="charCount">0 字</span>
            <label class="btn btn-ghost btn-sm upload-btn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              上传文件
              <input type="file" id="fileUpload" accept=".txt,.md" hidden>
            </label>
          </div>
          <textarea id="textInput" placeholder="输入或粘贴要合成的文本..." rows="10"></textarea>
        </div>
      </section>

      <!-- Right: Controls -->
      <section class="control-section">
        <!-- Voice -->
        <div class="control-group">
          <label class="control-label">音色</label>
          <div class="select-wrap">
            <select id="voiceSelect">
              <option value="">请先配置 API</option>
            </select>
            <button class="btn btn-ghost btn-sm" id="refreshVoices" title="刷新音色列表">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
          </div>
        </div>

        <!-- Speed -->
        <div class="control-group">
          <label class="control-label">
            <span>语速</span>
            <span class="param-value" id="speedVal">1.0x</span>
          </label>
          <div class="slider-wrap">
            <span class="slider-bound">0.25</span>
            <input type="range" id="speedSlider" min="0.25" max="4" step="0.05" value="1">
            <span class="slider-bound">4.0</span>
          </div>
        </div>

        <!-- Pitch -->
        <div class="control-group">
          <label class="control-label">
            <span>音调</span>
            <span class="param-value" id="pitchVal">0</span>
          </label>
          <div class="slider-wrap">
            <span class="slider-bound">-20</span>
            <input type="range" id="pitchSlider" min="-20" max="20" step="1" value="0">
            <span class="slider-bound">+20</span>
          </div>
        </div>

        <!-- Generate -->
        <button class="btn btn-primary btn-generate" id="generateBtn">
          <span class="btn-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>
          </span>
          生成语音
        </button>

        <!-- Status -->
        <div class="status-bar" id="statusBar" hidden>
          <span class="status-text" id="statusText"></span>
          <div class="status-spinner" id="statusSpinner" hidden></div>
        </div>

        <!-- Audio player -->
        <div class="player-card" id="playerCard" hidden>
          <div class="player-visualizer" id="visualizer">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <audio id="audioPlayer" controls></audio>
          <a class="btn btn-ghost btn-sm download-link" id="downloadLink" download>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载 MP3
          </a>
        </div>
      </section>
    </div>
  </main>

  <!-- ========== HISTORY TAB ========== -->
  <main class="panel" id="panel-history">
    <div class="history-list" id="historyList"></div>
    <div class="pagination" id="pagination" hidden></div>
    <div class="history-empty" id="historyEmpty" hidden>
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p>暂无历史记录</p>
    </div>
  </main>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script src="/js/app.js"></script>
</body>
</html>
